name: Pages source -> GitHub Actions

# The one setting this repository cannot change from a checkout.
#
# Settings -> Pages -> Build and deployment -> Source lives in the repository's
# settings, not in the tree, so no commit can express it — and while it says
# "Deploy from a branch" GitHub runs a second, legacy Jekyll build
# ("pages build and deployment", event `dynamic`) on every push. That build
# publishes the *repository root*, competes with `deploy.yml`, and wins often
# enough to matter: on 2026-09-21 it took the whole site down for about five
# minutes. `deploy.yml` carries a "Wait out GitHub's legacy Jekyll build" step
# for exactly this reason, but the real fix is one setting.
#
# `GITHUB_TOKEN` is allowed to change it — the Pages API asks for `pages: write`
# — so this workflow does the one-time edit from CI, and reports what happened
# on a **commit status** rather than in the log: job logs need a token to read,
# commit statuses do not. Once it has run, `pages build and deployment` stops
# being created at all and the "wait out" step in `deploy.yml` becomes a no-op
# (it already treats an absent legacy build as fine).
#
# It runs on push for its own file only. `paths` here narrows *this* workflow —
# it does not skip `deploy.yml`, and it is not the `paths-ignore` this repository
# has already been burned by.
on:
  push:
    paths:
      - '.github/workflows/pages-source.yml'
  workflow_dispatch:

# `pages: write` is what PUT /repos/{owner}/{repo}/pages requires; `statuses:
# write` is for the receipt at the bottom. Nothing else is needed, and nothing
# else is asked for.
permissions:
  pages: write
  statuses: write

jobs:
  set-source:
    runs-on: ubuntu-latest
    steps:
      - name: Point the Pages Source at GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          api="https://api.github.com/repos/$REPO"
          auth="Authorization: Bearer $GH_TOKEN"
          accept="Accept: application/vnd.github+json"
          version="X-GitHub-Api-Version: 2022-11-28"

          echo "== before =="
          curl -sS -H "$auth" -H "$accept" "$api/pages" || true
          echo

          code=$(curl -sS -o /tmp/put.json -w '%{http_code}' -X PUT \
            -H "$auth" -H "$accept" -H "$version" \
            -d '{"build_type":"workflow"}' "$api/pages")
          echo "== PUT -> HTTP $code =="
          cat /tmp/put.json || true
          echo

          echo "== after =="
          after=$(curl -sS -H "$auth" -H "$accept" "$api/pages")
          echo "$after"

          # One line, no `jq`: the runner is not a place to assume tools.
          build_type=$(printf '%s' "$after" | tr -d ' \n' \
            | sed -n 's/.*"build_type":"\([^"]*\)".*/\1/p')

          if [ "$code" = "204" ] || [ "$code" = "200" ]; then
            state=success
            desc="build_type=$build_type"
          else
            state=failure
            desc="PUT returned HTTP $code"
          fi
          echo "== receipt: $state ($desc) =="

          # The receipt, because it is the part that can be read without a token.
          curl -sS -o /dev/null -X POST -H "$auth" -H "$accept" -H "$version" \
            -d "{\"state\":\"$state\",\"context\":\"pages-source\",\"description\":\"$desc\"}" \
            "$api/statuses/$SHA" || true

          test "$state" = "success"
