name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Allow a single concurrent deployment, but never cancel one that is already
# publishing — that would leave Pages half deployed.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `output: 'export'` (see next.config.js) makes `next build` emit the whole
      # static site into `out/`, which is what GitHub Pages serves.
      #
      # `public/**` is copied verbatim into `out/`, which is where the site icons
      # come from (favicon.ico + the PNG set). Next does not rewrite those paths
      # for basePath, so `pages/_document.js` builds them itself.
      - name: Build static site
        run: npm run build
        env:
          NODE_ENV: production
          # Optional overrides for the music library endpoints; both fall back to
          # the defaults in `config/index.js`. Set them under
          # Settings -> Secrets and variables -> Actions when they change.
          NEXT_PUBLIC_MUSIC_WORKER_URL: ${{ vars.NEXT_PUBLIC_MUSIC_WORKER_URL }}
          NEXT_PUBLIC_MUSIC_R2_BASE: ${{ vars.NEXT_PUBLIC_MUSIC_R2_BASE }}

      # GitHub Pages would otherwise run Jekyll, which silently drops files and
      # directories starting with an underscore — including `_next/`.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      # A missing `out/` would ship a half-dead site. Fail the build here so it
      # is caught in CI instead of being discovered on the live site.
      #
      # Note the route shape: with `trailingSlash: true` Next emits `/h5` as
      # `out/h5/index.html` (a folder per route), NOT `out/h5.html`. GitHub Pages
      # then resolves `/music/h5/` to that file, and redirects bare `/music/h5`
      # to the trailing-slash form.
      - name: Verify build output
        run: |
          set -e
          test -f out/index.html      || { echo "::error::out/index.html missing"; exit 1; }
          test -f out/h5/index.html   || { echo "::error::out/h5/index.html missing"; exit 1; }
          test -f out/desktop/index.html || { echo "::error::out/desktop/index.html missing"; exit 1; }
          test -f out/404.html        || { echo "::error::out/404.html missing"; exit 1; }
          test -f out/.nojekyll       || { echo "::error::out/.nojekyll missing"; exit 1; }
          test -d out/_next/static    || { echo "::error::out/_next/static missing"; exit 1; }
          # Icons are copied from public/ and, unlike _next/*, Next does NOT
          # prefix them with basePath for us — a missing file is a silent 404 in
          # the browser tab. Assert them here instead.
          test -f out/favicon.ico        || { echo "::error::out/favicon.ico missing"; exit 1; }
          test -f out/apple-touch-icon.png || { echo "::error::out/apple-touch-icon.png missing"; exit 1; }
          test -f out/icon-512.png       || { echo "::error::out/icon-512.png missing"; exit 1; }
          # The service worker was removed on purpose; its reappearance would mean
          # a stale shell is being shipped again.
          test ! -e out/sw.js         || { echo "::error::out/sw.js exists — the service worker was removed on purpose"; exit 1; }
          node scripts/check-css-modules.js
          # The mini bar's "jump to the playing track" button is positioned
          # purely by CSS against the bar's box, across three files. Nothing in
          # the build catches a disagreement between those numbers, and the
          # failure mode is silent (button parked in the wrong place), so the
          # handshake is asserted here.
          node scripts/check-locate-btn.js
          # The player drawer's 唱片波纹 preference is written on toggle and read
          # on mount in a different file, and has to gate the ripples in both
          # layouts. A key typo or a half-gated switch also fails silently.
          node scripts/check-ripples-setting.js
          # The list preferences (不喜欢 + 置顶) are read on mount, written on
          # every change, and applied to the one list every downstream count
          # reads. A key typo, a half-gated filter, or a nested button would all
          # fail silently — the list looks fine, the totals are wrong, or the
          # three-dots button is silently torn out of the accessibility tree.
          node scripts/check-dislike-pin.js
          # The audio cache's 30-day expiry. The first version of it refreshed
          # the expiry inside the stored record, which meant rewriting the
          # audio blob on the read path — and a `readwrite` transaction blocks
          # every other transaction on the store, so the next song's cache read
          # never finished. Nothing in the build catches a timing behaviour, so
          # the "the read path must not write" invariant is asserted here.
          node scripts/check-cache-ttl.js
          # The playback mode (shuffle + repeat) is changed by three controls in
          # two layouts and has to survive a reload. Restoring it on mount and
          # persisting it on change are easy to write as two effects that race
          # on the mount commit — the writer then stores the pre-restore
          # defaults over the visitor's choice, and both effects look correct in
          # isolation. The lifted effect body is driven against a fake
          # localStorage here to pin that down.
          node scripts/check-playback-mode.js
          echo "build output verified"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        # Pages must be switched on once by hand, and the Source must be
        # "GitHub Actions" — NOT "Deploy from a branch":
        #   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
        #
        # With the source left on a branch, GitHub additionally runs its own
        # Jekyll build ("pages build and deployment", event `dynamic`) on every
        # push. That build succeeds and lands *after* this workflow's artifact,
        # so the live site ends up serving a Jekyll-rendered README instead of
        # `out/`, and every route except `/` 404s. Symptom to watch for: the
        # homepage contains `Jekyll SEO tag` and `/assets/css/style.css?v=<sha>`,
        # and `/.nojekyll` returns 404.

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub's Pages backend occasionally stalls; give it room so a slow
          # run is ridden out instead of leaving a stuck "in progress" deployment
          # that blocks every later one.
          timeout: 1800000 # 30 min
          error_count: 30
          reporting_interval: 15000 # 15 s
