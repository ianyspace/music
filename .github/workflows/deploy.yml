name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
    # Docs and the smoke script cannot change what gets built, and this workflow
    # does nothing *but* build and deploy — so a push that touches nothing else
    # does not need one. (`AGENTS.md` had to be corrected after the mark was
    # redrawn, and paying a full deploy for that is pure waste.)
    #
    # The caveat, and the reason this list is short: **if a test job is ever
    # added to this file, `scripts/**` has to come off it** — a change to the
    # tests is exactly the push where they need to run.
    paths-ignore:
      - '**.md'
      - 'scripts/**'
  # Still available for "deploy anyway", which is also how to publish a
  # docs-only change.
  workflow_dispatch:

# Allow a single concurrent deployment, but never cancel one that is already
# publishing — that would leave Pages half deployed.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  # Read-only, and only for the "wait out the legacy build" step below — it
  # lists this repo's workflow runs to see whether GitHub's own Jekyll build is
  # still in flight.
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The step below can wait, so bound the whole job rather than trusting the
    # runner's default. Ten minutes is ~8x a normal build.
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `output: 'export'` (see next.config.js) makes `next build` emit the whole
      # static site into `out/`, which is what GitHub Pages serves.
      #
      # `public/**` is copied verbatim into `out/`, which is where the site icons
      # come from (favicon.ico + the PNG set). Next does not rewrite those paths
      # for basePath, so `pages/_document.js` builds them itself.
      - name: Build static site
        run: npm run build
        env:
          NODE_ENV: production
          # Optional overrides for the music library endpoints; both fall back to
          # the defaults in `config/index.js`. Set them under
          # Settings -> Secrets and variables -> Actions when they change.
          NEXT_PUBLIC_MUSIC_WORKER_URL: ${{ vars.NEXT_PUBLIC_MUSIC_WORKER_URL }}
          NEXT_PUBLIC_MUSIC_R2_BASE: ${{ vars.NEXT_PUBLIC_MUSIC_R2_BASE }}

      # GitHub Pages would otherwise run Jekyll, which silently drops files and
      # directories starting with an underscore — including `_next/`.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      # A missing `out/` would ship a half-dead site. Fail the build here so it
      # is caught in CI instead of being discovered on the live site.
      #
      # Note the route shape: with `trailingSlash: true` Next emits `/h5` as
      # `out/h5/index.html` (a folder per route), NOT `out/h5.html`. GitHub Pages
      # then resolves `/music/h5/` to that file, and redirects bare `/music/h5`
      # to the trailing-slash form.
      - name: Verify build output
        run: |
          set -e
          test -f out/index.html      || { echo "::error::out/index.html missing"; exit 1; }
          test -f out/h5/index.html   || { echo "::error::out/h5/index.html missing"; exit 1; }
          test -f out/desktop/index.html || { echo "::error::out/desktop/index.html missing"; exit 1; }
          test -f out/404.html        || { echo "::error::out/404.html missing"; exit 1; }
          test -f out/.nojekyll       || { echo "::error::out/.nojekyll missing"; exit 1; }
          test -d out/_next/static    || { echo "::error::out/_next/static missing"; exit 1; }
          # Icons are copied from public/ and, unlike _next/*, Next does NOT
          # prefix them with basePath for us — a missing file is a silent 404 in
          # the browser tab. Assert them here instead.
          test -f out/favicon.ico        || { echo "::error::out/favicon.ico missing"; exit 1; }
          test -f out/apple-touch-icon.png || { echo "::error::out/apple-touch-icon.png missing"; exit 1; }
          test -f out/icon-512.png       || { echo "::error::out/icon-512.png missing"; exit 1; }
          # The mark at the leading end of the phone's bar is drawn on this
          # picture (see `h5/MarkNote`). It is not decoration: without it the
          # note sits on nothing, which is a *visual* break with no error
          # anywhere — and being a `public/` file, nothing else would notice.
          test -f out/mark-bg.jpg        || { echo "::error::out/mark-bg.jpg missing"; exit 1; }
          # The service worker was removed on purpose; its reappearance would mean
          # a stale shell is being shipped again.
          test ! -e out/sw.js         || { echo "::error::out/sw.js exists — the service worker was removed on purpose"; exit 1; }
          echo "build output verified"

      # GitHub also runs its own legacy Jekyll build ("pages build and
      # deployment", event `dynamic`) on every push whenever the Pages Source is
      # left on "Deploy from a branch". Both publish to the same site and **the
      # last one to finish wins**, so which site you get is a race — and on
      # 2026-09-20 the Jekyll build won by 13 seconds, leaving every route except
      # `/` as a 404 (symptoms in the note on `Setup Pages`).
      #
      # The real fix is one setting: Settings -> Pages -> Build and deployment ->
      # Source: "GitHub Actions". Until that is flipped, this step makes the race
      # harmless by waiting for that build to finish *before* we upload our
      # artifact, so ours is always the newer deployment. It is a no-op once the
      # setting is right (no such run is ever created) and it is bounded either
      # way, so a stuck run cannot hang the job.
      #
      # One-line `python3 -c` rather than a heredoc: a multi-line script inside a
      # `run: |` block has to be indented with the block, and Python rejects a
      # leading indent on its first line. `python3` is on every hosted runner.
      - name: Wait out GitHub's legacy Jekyll build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          legacy_state() {
            curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&per_page=100" \
            | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin).get('workflow_runs',[]) if x['name']=='pages build and deployment']; print('absent' if not r else ('running' if any(x['status']!='completed' for x in r) else 'done'))"
          }

          deadline=$((SECONDS + 300))
          while [ $SECONDS -lt $deadline ]; do
            state=$(legacy_state || echo absent)
            echo "legacy Pages build: $state"
            if [ "$state" = "done" ]; then break; fi
            # `absent` means the setting is already right, or the run has not
            # been created yet — one more look settles which.
            sleep 20
          done
          echo "proceeding; ours will be the newer deployment"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        # Pages must be switched on once by hand, and the Source must be
        # "GitHub Actions" — NOT "Deploy from a branch":
        #   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
        #
        # With the source left on a branch, GitHub additionally runs its own
        # Jekyll build ("pages build and deployment", event `dynamic`) on every
        # push. That build succeeds and lands *after* this workflow's artifact,
        # so the live site ends up serving a Jekyll-rendered README instead of
        # `out/`, and every route except `/` 404s. Symptom to watch for: the
        # homepage contains `Jekyll SEO tag` and `/assets/css/style.css?v=<sha>`,
        # and `/.nojekyll` returns 404.

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub's Pages backend occasionally stalls; give it room so a slow
          # run is ridden out instead of leaving a stuck "in progress" deployment
          # that blocks every later one.
          timeout: 1800000 # 30 min
          error_count: 30
          reporting_interval: 15000 # 15 s
